<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xguitar — MusicXML Viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
            color: #fff;
            font-family: sans-serif;
        }
        #xguitar-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #error-msg {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #c0392b;
            color: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            max-width: 80%;
            text-align: center;
            z-index: 9999;
            font-size: 14px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <canvas id="xguitar-canvas"></canvas>
    <div id="error-msg"></div>
    <script type="module">
        const errDiv = document.getElementById('error-msg');
        function showError(msg) {
            errDiv.textContent = msg;
            errDiv.style.display = 'block';
            console.error(msg);
        }
        try {
            import('./m_guitar.js').then(mod => {
                mod.default().catch(e => showError('WASM init failed: ' + e));
            }).catch(e => showError('Module load failed: ' + e));
        } catch(e) {
            showError('Script error: ' + e);
        }
    </script>
</body>
</html>
