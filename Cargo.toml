[package]
name = "m-guitar"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# ── Native (Linux/macOS/Windows) ──
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.35.0"
cpal = "0.18"
libc = "0.2"

# ── WASM (browser) ──
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "HtmlCanvasElement", "Window", "Document", "Element"] }
console_error_panic_hook = "0.1"
# ── Shared dependencies ──
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
roxmltree = "0.20"
rfd = "0.15"
serde_json = "1"
log = "0.4"

[build-dependencies]
pkg-config = "0.3"
